<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>CleanMap - Acceso Seguro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0 1em;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    #logo {
      width: 220px;
      max-width: 80vw;
      border-radius: 12px;
      margin-bottom: 1.5em;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-bottom: 1.2em;
      font-size: 5vw;
      color: #e2e8f0;
      font-weight: 500;
    }

    #loginBtn {
      font-size: 5vw;
      padding: 14px 28px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
      width: 80vw;
      max-width: 320px;
      min-height: 48px;
    }

    #loginBtn:hover {
      background-color: #3367d6;
    }

    #codigoBox {
      margin-top: 2em;
      padding: 1.2em;
      font-size: 4.5vw;
      background-color: #fdf6b2;
      color: #1a202c;
      border: 1px solid #f6e05e;
      border-radius: 10px;
      max-width: 90%;
      word-wrap: break-word;
      display: none;
    }

    #codigoBox span {
      font-size: 12vw;
      color: #d63384;
      display: inline-block;
      margin-top: 0.3em;
      font-weight: bold;
    }

    #volverMsg {
      margin-top: 1.5em;
      font-size: 4vw;
      color: #cbd5e0;
    }

    #volverBtn {
      margin-top: 1em;
      padding: 10px 22px;
      font-size: 4.5vw;
      background-color: #34a853;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: 0.3s;
      width: 80vw;
      max-width: 320px;
      min-height: 44px;
    }

    #volverBtn:hover {
      background-color: #2c8f47;
    }
  </style>
</head>

<body>

  <img
    id="logo"
    src="https://raw.githubusercontent.com/Gat0303/Index.html/cf38036da192a04eb68eb4b076dfe2ad7f2c34bc/WhatsApp%20Image%202026-06-03%20at%209.47.53%20PM.jpeg"
    alt="CleanMap Logo"
  >

  <h2>Iniciar sesión en CleanMap</h2>

  <button id="loginBtn">
    Iniciar sesión con Google
  </button>

  <div id="codigoBox"></div>

  <div id="volverMsg"></div>

  <button id="volverBtn">
    Volver a la aplicación
  </button>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyCCKnrNTyLmq50yfr_NGY4Yl1_SesboLHQ",
      authDomain: "my-v-care.firebaseapp.com",
      databaseURL: "https://my-v-care-default-rtdb.firebaseio.com",
      projectId: "my-v-care",
      storageBucket: "my-v-care.firebasestorage.app",
      messagingSenderId: "1048158040979",
      appId: "1:1048158040979:web:1ecadceb7fd7a2f33a6e66"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    document.getElementById("loginBtn").addEventListener("click", async () => {

      const provider = new firebase.auth.GoogleAuthProvider();

      try {

        const result = await auth.signInWithPopup(provider);
        const user = result.user;

        const userData = {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName,
          photoUrl: encodeURIComponent(user.photoURL || "")
        };

        const snapshot = await db.ref("Usuarios_CleanMap").once("value");

        const usuarios = snapshot.val() || {};

        let nuevoID = null;

        const emailLower = user.email.toLowerCase();

        for (const key in usuarios) {

          const emailExistente =
            usuarios[key].email?.toLowerCase();

          if (emailExistente === emailLower) {
            nuevoID = key;
            break;
          }
        }

        if (!nuevoID) {

          nuevoID =
            (Object.keys(usuarios).length + 1).toString();

          await db
            .ref("Usuarios_CleanMap/" + nuevoID)
            .set(userData);

        } else {

          await db
            .ref("Usuarios_CleanMap/" + nuevoID)
            .update(userData);
        }

        document.getElementById("codigoBox").innerHTML =
          `<strong>✅ Usuario registrado correctamente</strong><br><br>
          Copia este código de acceso:<br>
          <span>${nuevoID}</span>`;

        document.getElementById("codigoBox").style.display =
          "block";

        document.getElementById("volverMsg").innerText =
          "Ya puedes regresar a CleanMap.";

        const volverBtn =
          document.getElementById("volverBtn");

        volverBtn.style.display = "inline-block";

        volverBtn.onclick = () => {

          window.location.href =
            "appinventor.ai_gabrielmsanchezl09.CleanMap://callback?data=" +
            nuevoID;
        };

      } catch (error) {

        console.error(error);

        alert(
          "Error al iniciar sesión: " +
          error.message
        );
      }
    });

  </script>

</body>
</html>
